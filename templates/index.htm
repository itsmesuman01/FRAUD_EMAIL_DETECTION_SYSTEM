<!DOCTYPE html>
<html>
<head>
  <title>Email Fraud Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <div class="card">
    <h1>Email Fraud Detection System</h1>

    <form method="POST">
      <textarea name="email" placeholder="Paste email text here"></textarea>
      <button type="submit">Check Email</button>
    </form>

    {% if result %}
      <div class="result {% if 'SAFE' in result %}safe{% else %}fake{% endif %}">
        Result: {{ result }}
      </div>
    {% endif %}
  </div>

</body>
</html>

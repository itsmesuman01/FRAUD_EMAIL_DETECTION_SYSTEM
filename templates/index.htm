<!DOCTYPE html>
<html>
  <head>
    <title>Email Fraud Detector</title>
  </head>
  <body>
    <h1>Email Fraud Detection System</h1>

    <form method="POST">
      <textarea
        name="email"
        rows="8"
        cols="60"
        placeholder="Paste email text here"
      ></textarea>
      <br /><br />
      <button type="submit">Check Email</button>
    </form>

    {% if result %}
    <h2>Result: {{ result }}</h2>
    {% endif %}
  </body>
</html>
